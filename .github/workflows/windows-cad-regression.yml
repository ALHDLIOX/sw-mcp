name: Windows CAD Regression

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this real CAD regression is being run"
        required: false
        default: "manual validation"

jobs:
  cad-regression:
    # 真机只接受仓库内受控分支的手动触发；不接收 pull_request/外部代码。
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'wzyn20051216/solidworks-automation-skill' &&
      github.ref == 'refs/heads/test/p0-real-golden-mounting-bracket-2026'
    permissions:
      contents: read
    concurrency:
      group: controlled-windows-cad
      cancel-in-progress: false
    # 需要预装 SolidWorks/AutoCAD 的 Windows 自托管测试机。
    runs-on: [self-hosted, Windows, CAD]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Golden acceptance offline contracts
        run: python -m pytest tests/test_solidworks_golden_mounting_bracket_2026.py tests/test_core_execution.py tests/test_eval_runner.py -q
      - name: Environment doctor
        run: python scripts/cad_doctor.py
      - name: Lifecycle stability simulation
        run: python scripts/stability_regression.py
      - name: SolidWorks week 3 real regression
        run: python tests/solidworks_week3_delivery_regression.py
        env:
          CAD_STUDIO_VISIBLE: "false"
      - name: SolidWorks week 4 drawing and BOM regression
        run: python tests/solidworks_week4_drawing_regression.py
        env:
          CAD_STUDIO_VISIBLE: "false"
      - name: AutoCAD week 4 real regression
        run: python tests/autocad_week4_drawing_regression.py
        env:
          CAD_STUDIO_VISIBLE: "false"
      - name: AutoCAD backend preflight
        run: python subskills/autocad-automation/scripts/acad_dotnet_preflight.py
      - name: SolidWorks 2026 Golden mounting bracket (five independent runs)
        shell: pwsh
        run: python tests/solidworks_golden_mounting_bracket_2026.py --output "output/p0-golden-${{ github.run_id }}-${{ github.run_attempt }}" --runs 5
      - name: Upload CAD regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cad-regression-evidence
          if-no-files-found: ignore
          path: |
            output/**
            tests/output/**
            cad-studio-diagnostics.zip
